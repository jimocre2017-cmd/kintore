<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>体組成記録</title>
<meta name="theme-color" content="#121211">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f4f2; --surface:#ffffff; --surface-2:#f0efec; --line:#e2e1dc;
  --ink:#141413; --ink-2:#55544f; --ink-3:#8a8983;
  --accent:#2a78d6; --accent-ink:#ffffff; --accent-soft:#e3eefb;
  --good:#1a7f4b; --good-soft:#dff3e8; --danger:#c73a39; --danger-soft:#fbe7e7; --warn:#b26b00;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121211; --surface:#1c1c1a; --surface-2:#262624; --line:#34332f;
    --ink:#f5f4ef; --ink-2:#c3c2b7; --ink-3:#8f8e86;
    --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1d2d44;
    --good:#3fb57a; --good-soft:#1c3a2b; --danger:#e66767; --danger-soft:#3a1f1f; --warn:#e0a030;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;white-space:nowrap}
header .date{color:var(--ink-2);font-size:14px;white-space:nowrap}
header .sp{margin-left:auto}
@media (max-width:480px){ header .date{display:none} }
.navlink{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:10px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;white-space:nowrap}
.syncchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.syncchip i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.syncchip.pend i{background:var(--warn)} .syncchip.off i{background:var(--ink-3)} .syncchip.err i{background:var(--danger)}
.syncchip.err{color:var(--danger);border-color:var(--danger)}

.wrap{max-width:760px;margin:0 auto;padding:16px;padding-bottom:80px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card h3{margin:0 0 10px;font-size:13px;color:var(--ink-3);font-weight:600;letter-spacing:.04em}
.banner{border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7;background:var(--danger-soft);color:var(--danger)}
.banner.info{background:var(--accent-soft);color:var(--ink)}
.loading,.empty{color:var(--ink-3);text-align:center;padding:18px 8px;font-size:14px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stat b{display:block;font-size:26px;line-height:1.15}
.stat b small{font-size:14px;font-weight:600;margin-left:2px}
.stat span{font-size:12px;color:var(--ink-3)}
.stat.hot b{color:var(--good)} .stat.cold b{color:var(--danger)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .wide{grid-column:1/-1}
.btn{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;padding:0 14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.btn.small{min-height:40px;font-size:14px;padding:0 12px}
.btn:disabled{opacity:.5}

.rec{border:2px solid var(--good);background:var(--good-soft)}
.rec .big{font-size:44px;font-weight:800;line-height:1.1}
.rec .row{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0 12px}
.rec .row div b{font-size:22px;display:block}
.rec .row div span{font-size:12px;color:var(--ink-2)}
.rec .acts{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.rec .note{font-size:12px;color:var(--ink-2);margin-top:8px;line-height:1.6}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--danger);margin-right:6px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}

.calhead,.anhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calhead b,.anhead b{flex:1;text-align:center;font-size:16px}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dw{font-size:11px;color:var(--ink-3);text-align:center;padding:2px 0}
.cal .d{aspect-ratio:1;border-radius:8px;border:1px solid transparent;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--ink-2);padding:0;line-height:1.1}
.cal .d small{font-size:9px;color:inherit;opacity:.85}
.cal .d.blank{background:none;pointer-events:none}
.cal .d.done{background:var(--good);color:#fff;font-weight:700}
.cal .d.miss{background:var(--danger-soft);color:var(--danger)}
.cal .d.future{opacity:.35}
.cal .d.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.legend{display:flex;gap:12px;font-size:11px;color:var(--ink-3);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{flex:1;min-width:48px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:14px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kv div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-size:18px}
.kv span{font-size:11px;color:var(--ink-3)}
.bars{display:flex;align-items:flex-end;gap:2px;height:96px;margin-top:6px}
.bars .bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bars .bar i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:0}
.bars .bar.zero i{background:var(--line);height:2px!important}
.bars-l{display:flex;gap:2px;margin-top:3px}
.bars-l span{flex:1;text-align:center;font-size:10px;color:var(--ink-3);min-width:0;overflow:hidden;white-space:nowrap}

.hist .item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none}
.hist .item:last-child{border-bottom:0}
.hist .ic{font-size:24px;width:32px;text-align:center}
.hist .m{flex:1;min-width:0}
.hist .m b{font-size:15px}
.hist .m div{font-size:12px;color:var(--ink-3);margin-top:2px}
.hist .r{text-align:right;font-weight:700;font-size:16px;white-space:nowrap}
.hist .r small{display:block;font-size:11px;font-weight:500;color:var(--ink-3)}
.tag{display:inline-block;font-size:10px;border-radius:6px;padding:1px 6px;margin-left:6px;background:var(--surface-2);color:var(--ink-2);font-weight:600;vertical-align:1px}
.tag.pend{background:none;outline:1px dashed var(--warn);color:var(--warn)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal .box{background:var(--surface);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
@media (min-width:600px){ .modal{align-items:center} .modal .box{border-radius:18px} }
.modal h2{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px}
.modal h2 .x{margin-left:auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2)}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.f label{font-size:12px;color:var(--ink-3);font-weight:600}
.f input,.f select,.f textarea{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;width:100%}
.f textarea{height:auto;padding:10px 12px;resize:vertical}
.f .hint{font-size:12px;color:var(--ink-3);line-height:1.6}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.seg{display:flex;gap:8px}
.seg button{flex:1;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:700}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.preview{font-size:14px;background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.mbtns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:6px}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.dgrid div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.dgrid b{display:block;font-size:18px}
.dgrid span{font-size:11px;color:var(--ink-3)}
.map{width:100%;aspect-ratio:16/9;display:block;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);margin-bottom:12px}
.mapnote{font-size:11px;color:var(--ink-3);margin:-8px 0 12px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mgr .li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.mgr .li .t{flex:1;min-width:0}
.mgr .li .t small{display:block;color:var(--ink-3);font-size:11px}
.mgr h4{margin:14px 0 6px;font-size:13px;color:var(--ink-3)}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.show{opacity:1}
.toast.err{background:var(--danger);color:#fff}
.setup{max-width:560px;margin:40px auto;padding:0 16px;line-height:1.8}

#fTabs button,#mTabs button{font-size:12px;padding:0 2px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font-size:10px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--accent)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .goal{stroke:var(--good);stroke-width:1.5;stroke-dasharray:4 3}
.plan{line-height:1.8;font-size:14px}
.plan .row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:4px 0}
.plan .row:last-child{border-bottom:0}
.plan .row b{white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:600;color:var(--ink-3);font-size:11px;text-align:right;padding:4px 4px}
.tbl td{text-align:right;padding:8px 4px;border-top:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr.row{cursor:pointer}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--surface-2);border-radius:12px;padding:8px 8px 4px;min-width:0}
.mini .mh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.mini .mh b{font-size:17px}
.mini .md{font-size:11px;margin-bottom:2px}
.mini .chart{margin-top:2px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-weight:600;color:var(--ink-2)}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips button small{opacity:.7;margin-left:3px;font-weight:500}
.tag.cond{background:var(--accent);color:var(--accent-ink);margin:0 4px 0 0}
.avgrow td{font-weight:700;background:var(--surface-2)}
</style>
</head>
<body>
<header>
  <h1>体組成記録</h1>
  <span class="date" id="dateLbl"></span>
  <span class="sp"></span>
  <button class="syncchip" id="syncChip"><i></i><span>同期</span></button>
  <a class="navlink" href="photo.html">写真</a>
  <a class="navlink" href="meal.html">食事</a>
  <a class="navlink" href="index.html">← 筋トレ</a>
</header>

<div class="wrap" id="app">
  <div id="msg"></div>
  <section class="stats" id="stats"></section>
  <section class="actions"><button class="btn primary wide" id="addBtn">＋ 測定を記録（朝・昼・晩など何回でも）</button></section>
  <section class="card" id="filterCard"></section>
  <section class="card" id="dayCard"></section>
  <section class="card" id="chartCard"><div class="loading">読み込み中…</div></section>
  <section class="card" id="cmpCard"></section>
  <section class="card" id="planCard"></section>
  <section class="card" id="histCard"></section>
</div>

<div class="modal" id="formModal"><div class="box">
  <h2><span id="fTitle">体重計の数値を記録</span><button class="x" id="fClose" aria-label="閉じる">✕</button></h2>
  <div class="fgrid">
    <div class="f"><label>日付</label><input type="date" id="fDate"></div>
    <div class="f"><label>測った時刻</label><input type="time" id="fTime"></div>
  </div>
  <div class="f"><label>測定のタイミング・条件（複数選べます）</label><div class="chips" id="fTags"></div><div class="hint">体重・体脂肪率は、同じ条件で測ると比べやすくなります（例：起床後・排便後）。</div></div>
  <div class="fgrid">
    <div class="f"><label>体重（kg）</label><input type="number" id="fWeight" inputmode="decimal" step="0.1" min="20" max="300"></div>
    <div class="f"><label>体脂肪率（%）</label><input type="number" id="fFat" inputmode="decimal" step="0.1" min="1" max="70"></div>
    <div class="f"><label>骨格筋率（%）</label><input type="number" id="fMuscle" inputmode="decimal" step="0.1" min="5" max="70"></div>
    <div class="f"><label>BMI</label><input type="number" id="fBmi" inputmode="decimal" step="0.1" min="8" max="80" placeholder="空欄なら自動計算"></div>
    <div class="f"><label>基礎代謝（kcal）</label><input type="number" id="fBmr" inputmode="numeric" step="1" min="500" max="5000"></div>
    <div class="f"><label>内臓脂肪レベル</label><input type="number" id="fVisceral" inputmode="decimal" step="0.5" min="1" max="59"></div>
  </div>
  <div class="f"><label>身長（cm）</label><input type="number" id="fHeight" inputmode="decimal" step="0.1" min="100" max="230"><div class="hint">前回の値が入ります。BMIを空欄にすると、体重と身長から計算します。</div></div>
  <div class="f"><label>備考</label><textarea id="fMemo" rows="2" maxlength="300" placeholder="例：起床後・トイレ後"></textarea></div>
  <div class="mbtns"><button class="btn danger" id="fDel" style="display:none">削除</button><button class="btn primary" id="fSave" style="grid-column:span 1">保存</button></div>
</div></div>

<div class="modal" id="goalModal"><div class="box">
  <h2><span>目標の体脂肪率</span><button class="x" id="gClose" aria-label="閉じる">✕</button></h2>
  <div class="f"><label>目標（%）</label><input type="number" id="gFat" inputmode="decimal" step="0.5" min="0" max="60" placeholder="例：12（空欄＝目標なし）"><div class="hint">除脂肪体重を保ったまま、この体脂肪率になるための体重と減らす脂肪量を試算します。AIトレーナーの分析にも使われます。</div></div>
  <div class="mbtns"><button class="btn" id="gCancel">キャンセル</button><button class="btn primary" id="gSave">保存</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script src="api.js"></script>
<script src="body-lib.js"></script>
<script>
var BL = BodyLib;
var $ = function (id) { return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
var tTimer = null;
function toast(msg, err){
  var t = $('toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(tTimer); tTimer = setTimeout(function(){ t.className = 'toast' + (err ? ' err' : ''); }, 2600);
}
function p2(n){ return ('0'+n).slice(-2); }
function dowLbl(s){ return '日月火水木金土'.charAt((BL.toDays(s)+4)%7); }
function mdw(s){ var p = s.split('/'); return (+p[1])+'/'+(+p[2])+'（'+dowLbl(s)+'）'; }
function toInputDate(s){ return s.replace(/\//g,'-'); }
function fromInputDate(s){ return s.replace(/-/g,'/'); }
function v(x, u, d){ return x == null ? '－' : (d != null ? Number(x).toFixed(d) : x) + (u || ''); }
function sgn(n){ return n == null ? '－' : (n > 0 ? '+' : '') + n; }

var FIELDS = [
  { k: 'weight', label: '体重', unit: 'kg', d: 1, goalDown: true },
  { k: 'fat', label: '体脂肪率', unit: '%', d: 1, goalDown: true },
  { k: 'muscle', label: '骨格筋率', unit: '%', d: 1 },
  { k: 'bmi', label: 'BMI', unit: '', d: 1, goalDown: true },
  { k: 'bmr', label: '基礎代謝', unit: 'kcal', d: 0 },
  { k: 'visceral', label: '内臓脂肪', unit: '', d: 1, goalDown: true }
];
var S = { tag: '', day: '', data: null, view: null, mode: 'single', field: 'weight', range: 90, form: null, loadErr: null };

function latest(){ return S.view && S.view.logs.length ? S.view.logs[0] : null; }
// 項目ごとに、記録がある最新の値
function lastOf(k){ var L = S.view.logs; for (var i = 0; i < L.length; i++) if (L[i][k] != null) return L[i]; return null; }

function render(){
  if (!S.data) return;
  S.view = { today: S.data.today, goalFat: S.data.goalFat, logs: S.tag ? BL.daily(S.data.entries || [], S.tag) : S.data.logs };
  $('dateLbl').textContent = S.data.today.replace(/^(\d+)\/0?(\d+)\/0?(\d+)$/, '$1年$2月$3日')+'（'+dowLbl(S.data.today)+'）';
  renderMsg(); renderFilter(); renderDay(); renderStats(); renderChart(); renderCmp(); renderPlan(); renderHist();
}
function renderMsg(){
  var h = '';
  if (S.loadErr) h += '<div class="banner">'+esc(S.loadErr)+'</div>';
  var fl = KT.failed().filter(function(o){ return /^body/.test(o.type); });
  if (fl.length) h += '<div class="banner">送信できなかった記録があります（'+fl.length+'件）。右上の同期ボタンから確認できます。</div>';
  $('msg').innerHTML = h;
}
function renderStats(){
  var d = S.view, L = latest();
  if (!L) { $('stats').innerHTML = '<div class="card" style="grid-column:1/-1"><div class="empty">'+(S.tag?'「'+esc(S.tag)+'」の測定がまだありません。':'まだ記録がありません。「測定を記録」から入力してください。')+'</div></div>'; return; }
  var w = lastOf('weight'), c = BL.change(d.logs, 'weight', d.today, 28), sk = BL.streak(d.logs, d.today);
  var h = '';
  h += '<div class="stat"><b class="num">'+v(w && w.weight,'',1)+'<small>kg</small></b><span>体重（'+(S.tag||'日平均')+'・'+(w?mdw(w.date):'－')+'）</span></div>';
  h += '<div class="stat"><b class="num">'+v(lastOf('fat') && lastOf('fat').fat,'',1)+'<small>%</small></b><span>体脂肪率（'+(S.tag||'日平均')+'）</span></div>';
  h += '<div class="stat"><b class="num">'+(c?sgn(c.diff):'－')+'<small>kg</small></b><span>体重の4週間の変化'+(c?'':'（比べる記録なし）')+'</span></div>';
  h += '<div class="stat '+(sk?'hot':'')+'"><b class="num">'+sk+'<small>日</small></b><span>連続記録</span></div>';
  $('stats').innerHTML = h;
}

/* ---- 推移グラフ ---- */
var COLORS = { weight: '#2a78d6', fat: '#d9534f', muscle: '#1a9e5c', bmi: '#8e6bd1', bmr: '#d98a1f', visceral: '#c2478f' };
function renderChart(){
  var d = S.view;
  var h = '<div class="tabs" id="mTabs">'+[['single','1項目'],['all','全項目を並べる'],['overlay','重ねて比較']].map(function(m){ return '<button data-m="'+m[0]+'"'+(m[0]===S.mode?' class="on"':'')+'>'+m[1]+'</button>'; }).join('')+'</div>';
  if (S.mode === 'single') h += '<div class="tabs" id="fTabs">'+FIELDS.map(function(f){ return '<button data-k="'+f.k+'"'+(f.k===S.field?' class="on"':'')+'>'+f.label+'</button>'; }).join('')+'</div>';
  h += '<div class="tabs" id="rTabs">'+[[30,'30日'],[90,'90日'],[365,'1年'],[3650,'全期間']].map(function(r){ return '<button data-r="'+r[0]+'"'+(r[0]===S.range?' class="on"':'')+'>'+r[1]+'</button>'; }).join('')+'</div>';
  if (S.mode === 'single') {
    var F = FIELDS.filter(function(f){ return f.k === S.field; })[0], pts = BL.series(d.logs, F.k, d.today, S.range);
    h += pts.length < 2 ? '<div class="empty">'+F.label+'の記録が2件以上たまると、推移が表示されます。</div>' : lineSvg(pts, F, false);
  } else if (S.mode === 'all') {
    h += '<div class="mgrid">';
    FIELDS.forEach(function(f){
      var pts = BL.series(d.logs, f.k, d.today, S.range), last = pts.length ? pts[pts.length-1].v : null;
      var df = pts.length > 1 ? BL.r1(last - pts[0].v) : null;
      var good = df == null || df === 0 ? null : (f.goalDown ? df < 0 : df > 0);
      h += '<div class="mini"><div class="mh"><span>'+f.label+'</span><b class="num">'+(last == null ? '－' : last+(f.unit||''))+'</b></div>'
        + '<div class="md num" style="color:'+(good == null ? 'var(--ink-3)' : (good ? 'var(--good)' : 'var(--danger)'))+'">'+(df == null ? '比べる記録なし' : '期間の変化 '+(df > 0 ? '+' : '')+df.toFixed(f.d)+(f.unit||''))+'</div>'
        + (pts.length < 2 ? '<div class="empty" style="padding:22px 0">記録待ち</div>' : lineSvg(pts, f, true)) + '</div>';
    });
    h += '</div>';
  } else {
    h += overlaySvg(d);
  }
  $('chartCard').innerHTML = h;
  $('mTabs').onclick = function(e){ var b = e.target.closest('button'); if (b) { S.mode = b.getAttribute('data-m'); renderChart(); } };
  if ($('fTabs')) $('fTabs').onclick = function(e){ var b = e.target.closest('button'); if (b) { S.field = b.getAttribute('data-k'); renderChart(); } };
  $('rTabs').onclick = function(e){ var b = e.target.closest('button'); if (b) { S.range = +b.getAttribute('data-r'); renderChart(); } };
}
function lineSvg(pts, F, small){
  var W = small ? 300 : 640, H = small ? 110 : 220, pl = small ? 30 : 40, pr = 8, pt = small ? 8 : 14, pb = small ? 16 : 26;
  var vs = pts.map(function(p){ return p.v; }), lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
  if (hi - lo < 0.5) { hi += 0.5; lo -= 0.5; }
  var padv = (hi - lo) * 0.12; lo -= padv; hi += padv;
  var d0 = pts[0].day, d1 = pts[pts.length-1].day, span = Math.max(1, d1 - d0);
  function X(day){ return pl + (W - pl - pr) * (day - d0) / span; }
  function Y(val){ return pt + (H - pt - pb) * (1 - (val - lo) / (hi - lo)); }
  var col = COLORS[F.k] || 'var(--accent)';
  var s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+F.label+'の推移">';
  var gn = small ? 2 : 3;
  for (var i = 0; i <= gn; i++) {
    var gv = lo + (hi - lo) * i / gn, gy = Y(gv);
    s += '<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+gy+'" y2="'+gy+'"/><text x="'+(pl-4)+'" y="'+(gy+3)+'" text-anchor="end">'+gv.toFixed(F.d === 0 ? 0 : 1)+'</text>';
  }
  var path = pts.map(function(p, i){ return (i?'L':'M')+X(p.day).toFixed(1)+' '+Y(p.v).toFixed(1); }).join(' ');
  s += '<path class="ln" style="stroke:'+col+'" d="'+path+'"/>';
  pts.forEach(function(p){ s += '<circle class="pt" style="fill:'+col+'" cx="'+X(p.day).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(pts.length>60?1.6:(small?2.2:3))+'"><title>'+mdw(p.date)+' '+p.v+F.unit+'</title></circle>'; });
  if (F.k === 'fat' && S.data.goalFat && S.data.goalFat >= lo && S.data.goalFat <= hi) {
    var gy2 = Y(S.data.goalFat);
    s += '<line class="goal" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+gy2+'" y2="'+gy2+'"/><text x="'+(W-pr)+'" y="'+(gy2-4)+'" text-anchor="end" style="fill:var(--good)">目標 '+S.data.goalFat+'%</text>';
  }
  var a = pts[0].date.split('/'), b = pts[pts.length-1].date.split('/');
  s += '<text x="'+pl+'" y="'+(H-4)+'">'+(+a[1])+'/'+(+a[2])+'</text><text x="'+(W-pr)+'" y="'+(H-4)+'" text-anchor="end">'+(+b[1])+'/'+(+b[2])+'</text>';
  return s + '</svg>';
}
// 項目ごとに、期間の最初の値を100とした指数で重ねる（単位の違う項目の増減を同じ目盛りで比べる）
function overlaySvg(d){
  var W = 640, H = 240, pl = 44, pr = 12, pt = 14, pb = 26, lines = [], lo = 1e9, hi = -1e9, d0 = 1e12, d1 = -1e12;
  FIELDS.forEach(function(f){
    var pts = BL.series(d.logs, f.k, d.today, S.range);
    if (pts.length < 2) return;
    var base = pts[0].v; if (!base) return;
    var idx = pts.map(function(p){ return { day: p.day, date: p.date, v: p.v / base * 100, raw: p.v }; });
    idx.forEach(function(p){ lo = Math.min(lo, p.v); hi = Math.max(hi, p.v); d0 = Math.min(d0, p.day); d1 = Math.max(d1, p.day); });
    lines.push({ f: f, idx: idx });
  });
  if (!lines.length) return '<div class="empty">2件以上の記録がたまると、重ねて比較できます。</div>';
  lo = Math.min(lo, 100); hi = Math.max(hi, 100);
  if (hi - lo < 2) { hi += 1; lo -= 1; }
  var pv = (hi - lo) * 0.1; lo -= pv; hi += pv;
  var span = Math.max(1, d1 - d0);
  function X(day){ return pl + (W - pl - pr) * (day - d0) / span; }
  function Y(v){ return pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo)); }
  var s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="全項目の重ね比較">';
  for (var i = 0; i <= 4; i++) { var gv = lo + (hi - lo) * i / 4, gy = Y(gv); s += '<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+gy+'" y2="'+gy+'"/><text x="'+(pl-4)+'" y="'+(gy+3)+'" text-anchor="end">'+gv.toFixed(1)+'</text>'; }
  var y100 = Y(100); s += '<line class="goal" style="stroke:var(--ink-3)" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y100+'" y2="'+y100+'"/>';
  lines.forEach(function(L){
    var c = COLORS[L.f.k];
    s += '<path class="ln" style="stroke:'+c+'" d="'+L.idx.map(function(p, i){ return (i?'L':'M')+X(p.day).toFixed(1)+' '+Y(p.v).toFixed(1); }).join(' ')+'"/>';
    L.idx.forEach(function(p){ s += '<circle class="pt" style="fill:'+c+'" cx="'+X(p.day).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="2.4"><title>'+L.f.label+' '+mdw(p.date)+' '+p.raw+(L.f.unit||'')+'（'+p.v.toFixed(1)+'）</title></circle>'; });
  });
  s += '</svg><div class="legend">'+lines.map(function(L){ return '<span><i style="background:'+COLORS[L.f.k]+'"></i>'+L.f.label+'</span>'; }).join('')+'</div>'
    + '<div class="hint" style="font-size:12px;color:var(--ink-3);margin-top:6px">期間の最初の値を100とした指数です（点線＝100）。単位の違う項目でも、増減の割合を同じ目盛りで比べられます。</div>';
  return s;
}

var CMP = [[7,'1週間前'],[14,'2週間前'],[30,'1か月前'],[90,'3か月前'],[180,'半年前']];

  }
  if (e.bmi === '' && e.weight !== '' && e.height !== '') e.bmi = BL.bmi(e.weight, e.height);
  ['weight','fat','muscle','bmi','bmr','visceral','height'].forEach(function(k){ e[k] = e[k] === '' ? null : e[k]; });
  KT.call('bodySave', e).then(function(r){ S.data = r; S.day = date; closeForm(); render(); toast('保存しました'); }, function(er){ toast(er.message, true); });
};
$('fDel').onclick = function(){
  if (!confirm('この測定を削除しますか？')) return;
  KT.call('bodyDelete', S.form.id).then(function(r){ S.data = r; closeForm(); render(); toast('削除しました'); }, function(er){ toast(er.message, true); });
};
$('gClose').onclick = $('gCancel').onclick = function(){ $('goalModal').classList.remove('open'); };
$('gSave').onclick = function(){
  var s = $('gFat').value.trim(), n = s === '' ? 0 : Number(s);
  if (isNaN(n) || n < 0 || n > 60) { toast('0〜60で入力してください', true); return; }
  KT.call('bodySetGoal', n).then(function(r){ S.data = r; $('goalModal').classList.remove('open'); render(); toast('目標を保存しました'); }, function(er){ toast(er.message, true); });
};

/* ---- 同期表示・起動 ---- */
KT.onStatus(function(st){
  var c = $('syncChip'); if (!c) return;
  var cls = 'syncchip', txt;
  if (st.failed) { cls += ' err'; txt = '送信失敗 '+st.failed; }
  else if (st.syncing) { cls += ' pend'; txt = '送信中…'; }
  else if (st.pending) { cls += st.online ? ' pend' : ' off'; txt = (st.online ? '未送信 ' : 'オフライン・未送信 ')+st.pending; }
  else if (!st.online) { cls += ' off'; txt = 'オフライン'; }
  else if (st.error) { cls += ' err'; txt = '同期エラー'; }
  else { var t = st.syncedAt ? new Date(st.syncedAt) : null; txt = t ? '同期済 '+t.getHours()+':'+p2(t.getMinutes()) : '同期'; }
  c.className = cls; c.querySelector('span').textContent = txt;
  c.title = st.error ? st.error.message : '';
});
$('syncChip').addEventListener('click', function(){
  var fl = KT.failed();
  if (fl.length) {
    if (confirm('送信できなかった操作が '+fl.length+' 件あります。\n\n最初のエラー：'+(fl[0].error||'')+'\n\nOK＝もう一度送る ／ キャンセル＝そのまま')) KT.retryFailed();
    return;
  }
  KT.sync().then(function(){ return KT.call('bodyInit'); }).then(function(r){ S.data = r; S.loadErr = null; render(); toast('同期しました'); }, function(e){
    toast(e.offline ? 'オフラインです。つながったら自動で送信します' : '同期できませんでした：'+e.message, !e.offline);
  });
});
KT.onUpdate(function(){ KT.call('bodyCached').then(function(r){ if (r) { S.data = r; render(); } }); });

function showSetup(msg){
  $('app').innerHTML = '<div class="setup card"><h3 style="margin-top:0">アプリ版の設定が必要です</h3>'+(msg?'<p style="color:var(--danger)">'+esc(msg)+'</p>':'')
    + '<p>先に筋トレ記録の画面で設定を済ませてください。</p><p><a class="navlink" href="index.html">筋トレ記録を開く</a></p></div>';
}
// 古い api.js が端末に残っていると「不明な操作：bodyInit」になる。保存済みの画面ファイルを消して1回だけ読み込み直す
function healStaleCache(e){
  if (!e || !/^不明な操作：body(Init|Cached|Save|Delete|SetGoal)$/.test(e.message)) return false;
  try { if (sessionStorage.getItem('kt_heal_body')) return false; sessionStorage.setItem('kt_heal_body', '1'); } catch (x) { return false; }
  var done = function(){ location.reload(); };
  if (window.caches && caches.keys) caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); }).then(done, done);
  else done();
  return true;
}
function init(){
  if (!KT.configured()) { showSetup(); return; }
  KT.call('bodyCached').then(function(r){ if (r) { S.data = r; render(); } }, function(e){ healStaleCache(e); });
  KT.call('bodyInit').then(function(r){ S.data = r; S.loadErr = null; render(); }, function(e){
    if (healStaleCache(e)) return;
    if (e.auth) { KT.clearConfig(); showSetup('合言葉が一致しません。設定をやり直してください。'); return; }
    var hint = /^不明な操作：bodyGet$/.test(e.message) ? '（サーバー側の更新が必要です：gas/README.md の「体組成の導入手順」を実行してください）' : (/^不明な操作/.test(e.message) ? '（アプリの画面ファイルが古いままです。アプリを閉じて開き直してください）' : '');
    S.loadErr = '読み込みに失敗しました：' + e.message + hint;
    if (!S.data) S.data = { today: KT.today(), entries: [], logs: [], goalFat: 0 };
    render();
  });
}
init();
</script>
</body>
