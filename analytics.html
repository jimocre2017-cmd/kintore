<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>筋トレ分析</title>
<meta name="theme-color" content="#121211">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f4f2; --surface:#ffffff; --surface-2:#f0efec; --line:#e2e1dc; --grid:#ecebe7;
  --ink:#141413; --ink-2:#55544f; --ink-3:#8a8983;
  --accent:#2a78d6; --accent-ink:#ffffff; --accent-soft:#e3eefb; --series:#2a78d6; --series-prev:#c9c8c2;
  --up:#1a7f4b; --down:#c73a39;
  --body:#dcdbd6; --lv0:#ebeae6; --lv1:#3b82f6; --lv2:#eab308; --lv3:#dc2626;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121211; --surface:#1c1c1a; --surface-2:#262624; --line:#34332f; --grid:#2a2a27;
    --ink:#f5f4ef; --ink-2:#c3c2b7; --ink-3:#8f8e86;
    --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1d2d44; --series:#3987e5; --series-prev:#4a4945;
    --up:#3fb57a; --down:#e66767;
    --body:#3a3a37; --lv0:#4a4945; --lv1:#3b82f6; --lv2:#eab308; --lv3:#ef4444;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px}
header h1{font-size:18px;margin:0}
.navlink{display:inline-flex;align-items:center;padding:10px 14px;border-radius:10px;background:var(--surface-2);color:var(--ink);text-decoration:none;font-weight:600;border:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:none;background:transparent;padding:10px 16px;border-radius:9px;font-weight:600;color:var(--ink-2);min-width:52px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.nav{display:flex;align-items:center;gap:8px;flex:1;min-width:280px}
.nav button{width:48px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.nav .lbl{font-weight:700;font-size:17px;flex:1;text-align:center}
.nav .todayBtn{width:auto;padding:0 14px;font-size:14px;font-weight:600}
.nav button[disabled]{opacity:.35}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h2{margin:0 0 4px;font-size:16px}
.card .desc{font-size:12px;color:var(--ink-3);margin-bottom:12px}
.card-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.card-head .seg{margin-left:auto}
.card-head .seg button{padding:7px 12px;font-size:13px;min-width:0}

.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media (max-width:900px){ .tiles{grid-template-columns:repeat(2,1fr)} .tiles .tile:first-child{grid-column:span 2} }
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.tile .t{font-size:12px;color:var(--ink-3);font-weight:600}
.tile .v{font-size:28px;font-weight:800;margin:4px 0 2px;line-height:1.1}
.tile .v small{font-size:13px;color:var(--ink-2);font-weight:600;margin-left:2px}
.tile .c{font-size:12px;color:var(--ink-2)}
.delta{font-weight:700;white-space:nowrap}
.delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.flat{color:var(--ink-3)}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--ink-3);font-weight:600;text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:10px 8px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
td.l{text-align:left}
tr:last-child td{border-bottom:none}
.grp{font-size:11px;color:var(--ink-3);display:block}
.barcell{width:34%;min-width:120px}
.bartrack{position:relative;height:18px}
.bartrack i{position:absolute;left:0;top:3px;height:12px;border-radius:0 4px 4px 0;background:var(--series)}
.bartrack u{position:absolute;left:0;top:16px;height:2px;background:var(--series-prev)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hl{font-weight:800}
.muted{color:var(--ink-3)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-bottom:8px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;background:var(--series)}
.legend i.p{height:2px;background:var(--series-prev)}

.chart{position:relative}
.chart svg{display:block;width:100%;height:260px}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.5;white-space:nowrap;opacity:0;transform:translate(-50%,-100%);transition:opacity .1s}
.chart .tip.show{opacity:1}
.empty{color:var(--ink-3);padding:16px 0;text-align:center}
.loading{padding:40px;text-align:center;color:var(--ink-3)}
.two{display:grid;grid-template-columns:1fr;gap:16px}
td.memo{white-space:normal;min-width:180px;text-align:left;color:var(--ink-2)}
.memolist{display:flex;flex-direction:column;gap:8px}
.memoitem{border-left:3px solid var(--series);background:var(--surface-2);border-radius:0 10px 10px 0;padding:8px 12px}
.memoitem .meta{font-size:12px;color:var(--ink-3);margin-bottom:2px}
.memoitem .meta a{color:var(--accent);font-weight:700;text-decoration:none}
.memoitem .txt{font-size:14px;white-space:pre-wrap;word-break:break-word}
 
.holo{position:relative;overflow:hidden;border-radius:22px;padding:26px 28px 24px;color:#dcefff;
  background:
    radial-gradient(ellipse 42% 58% at 42% 56%, rgba(40,120,255,.20), rgba(20,70,160,.06) 55%, transparent 78%),
    radial-gradient(ellipse 120% 100% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%),
    linear-gradient(180deg,#07121f 0%,#050b14 100%);
  border:1px solid rgba(120,190,255,.12);
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif}
.holo::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:
    linear-gradient(rgba(110,180,255,.05) 1px, transparent 1px) 0 0/44px 44px,
    linear-gradient(90deg, rgba(110,180,255,.05) 1px, transparent 1px) 0 0/44px 44px;
  -webkit-mask-image:radial-gradient(ellipse 65% 70% at 42% 55%, #000 25%, transparent 80%);
          mask-image:radial-gradient(ellipse 65% 70% at 42% 55%, #000 25%, transparent 80%)}
.holo-top{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;z-index:2}
.holo-title{position:relative;max-width:360px;padding:4px 0 0 2px}
.holo-title h2{margin:0;font-size:30px;font-weight:700;letter-spacing:.06em;color:#ffffff;text-shadow:0 0 18px rgba(80,170,255,.45)}
.holo-sub{margin:4px 0 12px;font-size:12px;letter-spacing:.32em;color:#56b6ff;font-weight:600}
.holo-title p{margin:0;font-size:11.5px;line-height:1.8;color:rgba(200,225,255,.72)}
.holo-period{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;color:#bfe3ff;padding:6px 14px;border:1px solid rgba(110,190,255,.28);border-radius:4px;background:rgba(10,40,80,.25);white-space:nowrap}
.holo-period i{width:6px;height:6px;border-radius:50%;background:#56b6ff;box-shadow:0 0 8px #56b6ff}
.holo-stage{position:relative;display:flex;align-items:center;gap:10px;z-index:1;margin-top:4px}
.holo .figs{flex:1 1 auto;display:flex;justify-content:center;min-width:0}
.holofig{width:50%;max-width:500px;max-height:calc(100vh - 120px);min-height:460px;height:auto;overflow:visible}
.holofig .bodyimg{filter:drop-shadow(0 0 6px rgba(70,160,255,.55)) drop-shadow(0 0 22px rgba(40,120,255,.35))}
.holofig .ring{fill:none;stroke:#62c0ff}
.holofig .r0{stroke-opacity:.28;stroke-width:1;stroke-dasharray:2 6}.holofig .r1{stroke-opacity:.5;stroke-width:1.2}
.holofig .r2{stroke-opacity:.7;stroke-width:1.4}.holofig .r3{stroke-opacity:.9;stroke-width:1.6}
.holofig .mgray path{fill:#9aa9bb;fill-opacity:.16}
.holofig .mline{fill:none;stroke:#8fd4ff;stroke-opacity:.3;stroke-width:.8}
.holofig .mglows path{mix-blend-mode:screen;opacity:.75}
.holofig .mcores path{mix-blend-mode:screen}
.holofig .medge{fill:none;stroke-width:1.1;stroke-opacity:.95}
.holofig .medge.lv1{stroke:#9fd6ff}.holofig .medge.lv2{stroke:#ffe39a}.holofig .medge.lv3{stroke:#ff9aa2}
.holofig .spark circle{fill:#ffffff;animation:holoTwinkle 4s ease-in-out infinite}
.holofig .sidetag path{fill:rgba(8,30,60,.7);stroke:#56b6ff;stroke-opacity:.6;stroke-width:1.2}
.holofig .sidetag text{font-size:15px;fill:#dff1ff;letter-spacing:.2em}
.holo .mus{cursor:pointer;stroke:transparent;stroke-width:2;transition:stroke .2s}
.holo .mus:hover{stroke:rgba(255,255,255,.45)}
.holo .mus.sel{stroke:#ffffff;stroke-width:2.2}
.holofig .callout .cl-line{fill:none;stroke:#9fd6ff;stroke-opacity:.5;stroke-width:1}
.holofig .callout .cl-ring{fill:none;stroke:#ffffff;stroke-opacity:.85;stroke-width:1.2}
.holofig .callout .cl-dot{fill:#ffffff}
.holofig .callout .cl-name{font-size:17px;fill:#d4ecff;letter-spacing:.04em}
.holofig .callout .cl-num{font-size:44px;font-weight:600;fill:#ffffff;font-variant-numeric:tabular-nums}
.holofig .callout .cl-unit{font-size:13px;fill:rgba(190,220,255,.6);letter-spacing:.08em}
.holofig .callout.lv1 .cl-num{fill:#7cc2ff}.holofig .callout.lv2 .cl-num{fill:#ffd35c}.holofig .callout.lv3 .cl-num{fill:#ff6b77}
@keyframes holoTwinkle{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes holoScan{0%{transform:translateY(0)}100%{transform:translateY(1070px)}}
@media (prefers-reduced-motion: reduce){ .holofig .spark circle{animation:none} }
 
.holo-side{flex:0 0 272px;display:flex;flex-direction:column;gap:18px}
.hud{position:relative;padding:16px 18px;background:linear-gradient(180deg,rgba(10,34,70,.55),rgba(6,20,44,.4));
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.hud::before{content:"";position:absolute;inset:0;pointer-events:none;padding:1px;
  background:linear-gradient(135deg,rgba(120,200,255,.85),rgba(60,140,255,.25) 40%,rgba(60,140,255,.25) 60%,rgba(120,200,255,.85));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.hud-t{font-size:10.5px;letter-spacing:.2em;color:#56b6ff;margin-bottom:8px}
.holo .maplegend{display:block;flex:none;min-width:0;gap:0}
.holo .maplegend .lg{display:flex;align-items:center;gap:12px;font-size:12.5px;white-space:nowrap;color:#e6f3ff;padding:8px 0}
.ind{display:inline-block;width:16px;height:16px;border-radius:3px;flex:none}
.ind.lv3{background:#ff4655;box-shadow:0 0 10px rgba(255,70,85,.7)}
.ind.lv2{background:#ffc233;box-shadow:0 0 10px rgba(255,194,51,.6)}
.ind.lv1{background:#2f95ff;box-shadow:0 0 10px rgba(47,149,255,.7)}
.ind.lv0{background:#6b7888}
.hud-tap{display:flex;align-items:center;gap:12px}
.tapico{width:40px;height:40px;flex:none}
.tapico .finger{fill:rgba(86,182,255,.12);stroke:#8fd4ff;stroke-width:1.1;stroke-linejoin:round}
.tapico .rip{fill:none;stroke:#56b6ff;stroke-opacity:.6;stroke-width:.8;animation:holoRip 2.6s ease-out infinite;transform-origin:17px 11px}
.tapico .rip2{fill:#56b6ff;fill-opacity:.45}
@keyframes holoRip{0%{transform:scale(.45);opacity:1}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion: reduce){ .tapico .rip{animation:none} }
.holo .mapinfo{margin:0;padding:0;background:none;border-radius:0;font-size:13px;line-height:1.7;color:#dcefff;min-height:0}
.holo .mapinfo b{color:#fff;font-weight:700}
.holo .mapextra{display:flex;flex-direction:column;gap:6px}
.holo .mapextra span{display:flex;align-items:center;gap:10px;font-size:12px;color:#e6f3ff;background:none;padding:2px 0}
.holo .mapextra .ind{width:10px;height:10px}
 
.holo-readout{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);margin-top:8px;padding-top:18px;border-top:1px solid rgba(110,190,255,.14)}
.holo-readout div{padding:0 24px;border-left:1px solid rgba(110,190,255,.12)}
.holo-readout div:first-child{border-left:none;padding-left:0}
.holo-readout span{display:block;font-size:11px;letter-spacing:.06em;color:rgba(170,210,255,.62);margin-bottom:6px}
.holo-readout b{display:block;font-size:36px;font-weight:600;line-height:1.05;color:#ffffff;font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(80,170,255,.35)}
.holo-readout small{font-size:14px;font-weight:400;color:rgba(170,210,255,.6);margin-left:6px}
@media (max-width:980px){
  .holo-stage{flex-wrap:wrap;margin-top:0} .holo-side{flex:1 1 100%;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .holo .maplegend{grid-row:span 2} .holofig{max-height:none} }
@media (max-width:600px){
  .holo{padding:20px 14px} .holo-top{flex-direction:column} .holo-side{grid-template-columns:1fr} .holo .maplegend{grid-row:auto}
  .holo-readout{grid-template-columns:1fr 1fr;row-gap:16px} .holo-readout div:nth-child(3){border-left:none;padding-left:0}
  .holo-readout b{font-size:26px} }
.offbar{background:var(--surface-2);border:1px solid var(--line);border-left:4px solid #e0a030;border-radius:10px;padding:10px 14px;font-size:13px;color:var(--ink-2)}
</style>
</head>
<body>
<header>
  <a class="navlink" href="index.html">← 記録</a>
  <h1>筋トレ分析</h1>
</header>
<div class="wrap">
  <div class="controls">
    <div class="seg" id="periodSeg">
      <button data-p="day" class="on">日</button><button data-p="week">週</button><button data-p="month">月</button><button data-p="quarter">四半期</button><button data-p="year">年</button>
    </div>
    <div class="nav">
      <button id="prevBtn" aria-label="前へ">◀</button>
      <div class="lbl" id="rangeLbl">—</div>
      <button id="nextBtn" aria-label="次へ">▶</button>
      <button class="todayBtn" id="todayBtn">今日</button>
    </div>
  </div>
  <div id="offBanner" class="offbar" style="display:none"></div>
  <div id="content"><div class="loading">読み込み中…</div></div>
</div>

<script src="api.js"></script>
<script>
var ST = { type:'day', anchor:null, data:null, metric:'vol', trendMetric:'vol' };
var METRICS = { vol:{l:'総負荷量',u:'kg'}, reps:{l:'レップ',u:'回'}, sets:{l:'セット',u:'セット'}, secs:{l:'秒',u:'秒'}, days:{l:'日数',u:'日'} };
var PREV_NAME = { day:'前日', week:'前週', month:'前月', quarter:'前四半期', year:'前年' };

var call = KT.call; // オンライン時は最新、オフライン時は保存済みの結果（api.js）
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function fmt(n){ n=Number(n)||0; return (Math.round(n*10)/10).toLocaleString('ja-JP'); }
function fmtKg(n){ n=Number(n)||0; return (Math.round(n*100)/100).toString(); }
function fmtSecs(s){ s=Math.round(Number(s)||0); if (s<60) return s+'秒'; var m=Math.floor(s/60), r=s%60; if (m<60) return m+'分'+(r?r+'秒':''); return Math.floor(m/60)+'時間'+(m%60)+'分'; }
function mval(o, k){ return Number(o[k])||0; }
function mfmt(k, v){ return k==='secs' ? fmtSecs(v) : fmt(v)+(k==='vol'?'kg':k==='reps'?'回':k==='sets'?'セット':k==='days'?'日':''); }

function delta(cur, prev){
  if (!prev && !cur) return '<span class="delta flat">—</span>';
  if (!prev) return '<span class="delta up">▲ 新規</span>';
  var p = (cur-prev)/prev*100;
  if (Math.abs(p) < 0.5) return '<span class="delta flat">± 0%</span>';
  return '<span class="delta '+(p>0?'up':'down')+'">'+(p>0?'▲ ':'▼ ')+Math.abs(Math.round(p))+'%</span>';
}


var CACHE = {}, SEQ = 0;
function load(){
  var key = ST.type+'|'+(ST.anchor||'today'), my = ++SEQ, hit = CACHE[key];
  if (hit && Date.now()-hit.t < 60000){ ST.data = hit.d; ST.anchor = hit.d.anchor; $('content').style.opacity = 1; showOffline(hit.d); render(); return; }
  $('content').style.opacity = .5;
  call('getAnalytics', ST.type, ST.anchor).then(function(d){
    if (!d._cachedAt) CACHE[key] = CACHE[d.type+'|'+d.anchor] = { t: Date.now(), d: d };
    if (my !== SEQ) return;
    ST.data = d; ST.anchor = d.anchor;
    $('content').style.opacity = 1;
    showOffline(d);
    render();
  }).catch(function(e){
    if (my !== SEQ) return;
    $('content').style.opacity = 1;
    $('content').innerHTML = '<div class="card loading">'+(e.nocfg ? 'アプリ版の設定がまだです。記録画面から設定してください。' : e.offline ? esc(e.message) : '読み込みに失敗しました：'+esc(e.message))+'</div>';
  });
}
// オフライン時は「いつ時点のデータか」と未送信の件数を表示
function showOffline(d){
  var b = $('offBanner');
  if (!d._cachedAt){ b.style.display = 'none'; return; }
  var t = new Date(d._cachedAt), pend = KT.status().pending;
  b.textContent = 'オフライン表示：'+(t.getMonth()+1)+'/'+t.getDate()+' '+t.getHours()+':'+('0'+t.getMinutes()).slice(-2)+' 時点のデータです'
    + (pend ? '（未送信の '+pend+' 件は含まれていません）' : '') + '。オンラインになると最新になります。';
  b.style.display = '';
}
window.addEventListener('online', function(){ CACHE = {}; load(); });

function shift(n){
  if (!ST.anchor) return;
  var p = ST.anchor.split('/').map(Number), dt;
  if (ST.type==='day') dt = new Date(p[0],p[1]-1,p[2]+n);
  else if (ST.type==='week') dt = new Date(p[0],p[1]-1,p[2]+7*n);
  else if (ST.type==='month') dt = new Date(p[0],p[1]-1+n,1);
  else if (ST.type==='quarter') dt = new Date(p[0],p[1]-1+3*n,1);
  else dt = new Date(p[0]+n,0,1);
  ST.anchor = dt.getFullYear()+'/'+('0'+(dt.getMonth()+1)).slice(-2)+'/'+('0'+dt.getDate()).slice(-2);
  load();
}

function setType(t, anchor){
  ST.type = t; if (anchor) ST.anchor = anchor;
  Array.prototype.forEach.call(document.querySelectorAll('#periodSeg button'), function(b){ b.classList.toggle('on', b.getAttribute('data-p')===t); });
  load();
}

function render(){
  var d = ST.data, pn = PREV_NAME[d.type];
  $('rangeLbl').textContent = d.range.label;
  $('nextBtn').disabled = d.range.end >= d.today;

  var c = d.total.cur, p = d.total.prev;
  var h = '<div class="tiles">';
  [['vol','総負荷量'],['reps','レップ'],['sets','セット'],['secs','秒種目の合計'],['days','トレーニング日数']].forEach(function(m){
    var k=m[0], v=mval(c,k), pv=mval(p,k), val;
    if (k==='secs') val = '<span class="num">'+fmtSecs(v)+'</span>';
    else val = '<span class="num">'+fmt(v)+'</span><small>'+(k==='vol'?'kg':k==='reps'?'回':k==='sets'?'セット':'日')+'</small>';
    if (k==='days' && d.type!=='day') val += '<small> / '+d.periodDays+'日</small>';
    h += '<div class="tile"><div class="t">'+m[1]+'</div><div class="v">'+val+'</div><div class="c">'+pn+' '+mfmt(k,pv)+'　'+delta(v,pv)+'</div></div>';
  });
  h += '</div>';

  h += '<div id="mapSlot"></div>';

  
  h += '<div class="card"><div class="card-head"><div><h2>部位別</h2><div class="desc">バー＝今期間の'+METRICS[ST.metric].l+'、下の細線＝'+pn+'。前期比は選択中の指標で比較。付随部位は0.5換算で加算</div></div>'
    + metricSeg('metric', ['vol','reps','sets']) + '</div>';
  if (!d.byPart.length) h += '<div class="empty">この期間の記録はありません</div>';
  else {
    var max = 0; d.byPart.forEach(function(r){ max = Math.max(max, mval(r.cur,ST.metric), mval(r.prev,ST.metric)); });
    h += '<div class="scroll"><table><thead><tr><th>部位</th><th class="barcell"></th><th>セット</th><th>レップ</th><th>総負荷量</th><th>秒</th><th>'+pn+'</th><th>前期比</th></tr></thead><tbody>';
    d.byPart.forEach(function(r){
      var cv = mval(r.cur,ST.metric), pv = mval(r.prev,ST.metric);
      h += '<tr><td class="l"><span class="grp">'+esc(r.group)+'</span><b>'+esc(r.part)+'</b></td>'
        + '<td class="barcell"><div class="bartrack" title="'+esc(r.part)+'：'+mfmt(ST.metric,cv)+'（'+pn+' '+mfmt(ST.metric,pv)+'）">'
        + '<i style="width:'+(max?cv/max*100:0)+'%"></i><u style="width:'+(max?pv/max*100:0)+'%"></u></div></td>'
        + '<td class="num'+(ST.metric==='sets'?' hl':'')+'">'+fmt(r.cur.sets)+'</td>'
        + '<td class="num'+(ST.metric==='reps'?' hl':'')+'">'+fmt(r.cur.reps)+'</td>'
        + '<td class="num'+(ST.metric==='vol'?' hl':'')+'">'+(r.cur.vol?fmt(r.cur.vol)+'kg':'<span class="muted">—</span>')+'</td>'
        + '<td class="num">'+(r.cur.secs?fmtSecs(r.cur.secs):'<span class="muted">—</span>')+'</td>'
        + '<td class="num muted">'+mfmt(ST.metric,pv)+'</td><td>'+delta(cv,pv)+'</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';

  
  if (d.trend.length){
    var unit = d.type==='year' ? '月別' : d.type==='quarter' ? '週別' : '日別';
    h += '<div class="card"><div class="card-head"><div><h2>推移（'+unit+'）</h2><div class="desc">棒をタップするとその'+(d.type==='year'?'月':d.type==='quarter'?'週':'日')+'に移動します</div></div>'
      + metricSeg('trendMetric', ['vol','reps','sets','secs']) + '</div>'
      + '<div class="chart" id="chart"></div></div>';
  }

  
  h += '<div class="card"><h2>種目別</h2><div class="desc">最大負荷は入力した重さ（片手）。ベストは総負荷量（秒種目は秒数）が最大のセット</div>';
  if (!d.byExercise.length) h += '<div class="empty">この期間の記録はありません</div>';
  else {
    h += '<div class="scroll"><table><thead><tr><th>種目</th><th>部位</th><th>セット</th><th>レップ / 秒</th><th>総負荷量</th><th>最大負荷</th><th>ベストセット</th><th>前期比(量)</th></tr></thead><tbody>';
    d.byExercise.forEach(function(e){
      var isSec = e.measure==='秒';
      var main = isSec ? fmtSecs(e.cur.secs) : fmt(e.cur.reps)+'回';
      var best = '—';
      if (e.best){
        if (isSec) best = e.best.secs+'秒';
        else if (e.loadType==='kg') best = fmtKg(e.best.load)+'kg×'+e.best.reps+'回';
        else if (e.loadType==='加重' && e.best.load) best = '+'+fmtKg(e.best.load)+'kg×'+e.best.reps+'回';
        else best = e.best.reps+'回';
      }
      var key = isSec ? 'secs' : (e.cur.vol || e.prev.vol ? 'vol' : 'reps');
      h += '<tr><td class="l"><b>'+esc(e.name)+'</b>'+(e.intensity?'<span class="grp">'+esc(e.intensity)+'</span>':'')+'</td><td class="l">'+esc(e.part)+'</td>'
        + '<td class="num">'+e.cur.sets+'</td><td class="num">'+main+'</td>'
        + '<td class="num">'+(e.cur.vol?fmt(e.cur.vol)+'kg':'<span class="muted">—</span>')+'</td>'
        + '<td class="num">'+(e.maxLoad?fmtKg(e.maxLoad)+'kg':'<span class="muted">—</span>')+'</td>'
        + '<td class="num">'+best+'</td><td>'+delta(mval(e.cur,key), mval(e.prev,key))+'</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';

  
  if (d.type==='day'){
    h += '<div class="card"><h2>セット明細</h2><div class="desc">この日に記録した全セット（取消は除く）</div>';
    if (!d.sets.length) h += '<div class="empty">この日の記録はありません</div>';
    else {
      h += '<div class="scroll"><table><thead><tr><th>時刻</th><th>種目</th><th>部位</th><th>セット</th><th>内容</th><th>集計</th><th>総負荷量</th><th style="text-align:left">備考</th></tr></thead><tbody>';
      d.sets.forEach(function(s){
        var content = s.secs ? s.secs+'秒' : (s.load ? fmtKg(s.load)+'kg × ' : '')+s.reps+'回';
        if (s.intensity) content += '（'+esc(s.intensity)+'）';
        h += '<tr><td class="num l">'+esc(s.at)+'</td><td class="l">'+esc(s.exName)+'</td><td class="l">'+esc(s.part)+'</td><td class="num">'+s.setNo+'</td>'
          + '<td class="num">'+content+'</td><td class="num">'+(s.aSecs?fmtSecs(s.aSecs):fmt(s.aReps)+'回')+'</td><td class="num">'+(s.vol?fmt(s.vol)+'kg':'<span class="muted">—</span>')+'</td><td class="memo">'+(s.memo?esc(s.memo):'<span class="muted">—</span>')+'</td></tr>';
      });
      h += '</tbody></table></div>';
    }
    h += '</div>';
  } else {
    h += '<div class="card"><h2>日計</h2><div class="desc">トレーニングした日ごとの合計。日付をタップするとその日の明細を表示</div>';
    if (!d.daily.length) h += '<div class="empty">この期間の記録はありません</div>';
    else {
      h += '<div class="scroll"><table><thead><tr><th>日付</th><th>セット</th><th>レップ</th><th>総負荷量</th><th>秒</th><th>部位</th></tr></thead><tbody>';
      d.daily.forEach(function(r){
        var p = r.date.split('/');
        h += '<tr><td class="l"><a href="#" data-day="'+r.date+'" style="color:var(--accent);font-weight:700;text-decoration:none">'+(+p[1])+'/'+(+p[2])+'（'+r.dow+'）</a></td>'
          + '<td class="num">'+r.sets+'</td><td class="num">'+fmt(r.reps)+'</td><td class="num">'+(r.vol?fmt(r.vol)+'kg':'—')+'</td><td class="num">'+(r.secs?fmtSecs(r.secs):'—')+'</td>'
          + '<td class="l" style="white-space:normal">'+r.parts.map(esc).join('・')+'</td></tr>';
      });
      h += '</tbody></table></div>';
    }
    h += '</div>';
  }

  
  if (d.type!=='day'){
    h += '<div class="card"><h2>備考</h2><div class="desc">この期間にセットへ残した備考（新しい順）。日付をタップするとその日の明細を表示</div>';
    if (!d.memos || !d.memos.length) h += '<div class="empty">この期間の備考はありません</div>';
    else {
      h += '<div class="memolist">' + d.memos.map(function(m){
        var p = m.date.split('/');
        return '<div class="memoitem"><div class="meta"><a href="#" data-day="'+m.date+'">'+(+p[1])+'/'+(+p[2])+'</a> '+esc(m.at)+'・'+esc(m.exName)+' '+m.setNo+'セット目</div><div class="txt">'+esc(m.memo)+'</div></div>';
      }).join('') + '</div>';
    }
    h += '</div>';
  }

  $('content').innerHTML = h;
  
  ST.mapNew = false;
  if (ST.mapFor !== d || !ST.mapEl){ var w = document.createElement('div'); w.innerHTML = mapCard(d); ST.mapEl = w.firstChild; ST.mapFor = d; ST.mapNew = true; }
  var slot = $('mapSlot'); slot.parentNode.replaceChild(ST.mapEl, slot);
  bindMetricSegs();
  Array.prototype.forEach.call(document.querySelectorAll('[data-day]'), function(a){
    a.addEventListener('click', function(e){ e.preventDefault(); setType('day', a.getAttribute('data-day')); });
  });
  if (d.trend.length) drawTrend();
  if (ST.mapNew) bindBodyMap();
}

var TWIN_COL = ['#8a97a8', '#2f95ff', '#ffc233', '#ff4655'];
function mirrorPath(d) {
  return d.replace(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g, function (m, x, y) { return (500 - Number(x)) + ',' + y; });
}
function twinShapes(side) {
  var out = [];
  BODY[side].forEach(function (m) {
    out.push({ part: m[0], d: m[1], anchor: m[3] || null, k: 0 });
    if (!m[2]) out.push({ part: m[0], d: mirrorPath(m[1]), anchor: m[3] ? [500 - m[3][0], m[3][1]] : null, k: 1 });
  });
  return out;
}

function bodySvg(side, levels, titles, callouts) {

    + '<defs>'
    + [1, 2, 3].map(function (lv) {

      return '<radialGradient id="' + id + 'm' + lv + '" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset=".18" stop-color="' + c + '" stop-opacity=".95"/><stop offset=".65" stop-color="' + c + '" stop-opacity=".55"/><stop offset="1" stop-color="' + c + '" stop-opacity=".18"/></radialGradient>';
    }).join('')
    + '<radialGradient id="' + id + 'pad" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#57b8ff" stop-opacity=".55"/><stop offset=".5" stop-color="#2f7fff" stop-opacity=".16"/><stop offset="1" stop-color="#2f7fff" stop-opacity="0"/></radialGradient>'
    + '<radialGradient id="' + id + 'aura" cx=".5" cy=".48" r=".5"><stop offset="0" stop-color="#2f8cff" stop-opacity=".22"/><stop offset=".6" stop-color="#2f8cff" stop-opacity=".06"/><stop offset="1" stop-color="#2f8cff" stop-opacity="0"/></radialGradient>'
    + '<linearGradient id="' + id + 'scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fdcff" stop-opacity="0"/><stop offset=".9" stop-color="#9fdcff" stop-opacity=".08"/><stop offset="1" stop-color="#e6f7ff" stop-opacity=".45"/></linearGradient>'
    + '<filter id="' + id + 'glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>'
    + '<filter id="' + id + 'soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>'
    + '<clipPath id="' + id + 'clip"><rect x="0" y="0" width="500" height="1000"/></clipPath>'
    + '</defs>';
  
  s += '<ellipse cx="250" cy="500" rx="250" ry="520" fill="url(#' + id + 'aura)"/>';
  s += '<g class="pad"><ellipse cx="250" cy="968" rx="176" ry="34" fill="url(#' + id + 'pad)"/>'
    + '<ellipse cx="250" cy="968" rx="168" ry="31" class="ring r0"/><ellipse cx="250" cy="968" rx="140" ry="25" class="ring r1"/>'
    + '<ellipse cx="250" cy="968" rx="108" ry="19" class="ring r2"/><ellipse cx="250" cy="968" rx="74" ry="13" class="ring r3"/>'
    + '<ellipse cx="250" cy="968" rx="40" ry="7" class="ring r3"/></g>';
  
  s += '<image href="' + (front ? TWIN_IMG.front : TWIN_IMG.back) + '" x="0" y="0" width="500" height="1000" class="bodyimg" preserveAspectRatio="none"/>';
  
  var glow = '', core = '', lines = '', gray = '';
  shapes.forEach(function (sh) {
    var lv = sh.part ? (levels[sh.part] || 0) : 0;
    if (lv > 0) {
      glow += '<path d="' + sh.d + '" fill="' + TWIN_COL[lv] + '" class="mglow lv' + lv + '" filter="url(#' + id + 'glow)"/>';
      core += '<path d="' + sh.d + '" style="fill:url(#' + id + 'm' + lv + ')" class="mcore lv' + lv + '"/>';
    } else if (sh.part) {
      gray += '<path d="' + sh.d + '"/>';
    }
    lines += '<path d="' + sh.d + '" class="' + (lv > 0 ? 'medge lv' + lv : 'mline') + '"/>';
  });
  s += '<g class="mgray">' + gray + '</g><g class="mglows">' + glow + '</g><g class="mcores">' + core + '</g><g class="mlines">' + lines + '</g>';
  s += '<g class="spark"></g>';
  
  var anchor = {};
  shapes.forEach(function (sh) {
    if (!sh.part) return;
    var lv = levels[sh.part] || 0, title = titles[sh.part] || sh.part;
    s += '<path d="' + sh.d + '" class="mus lv' + lv + '" data-part="' + sh.part + '" style="fill:transparent"><title>' + title + '</title></path>';
    if (lv > 0 && sh.anchor && ((front && sh.k === 0) || (!front && (sh.k === 1 || BODY.back.some(function (m) { return m[0] === sh.part && m[2]; }))))) anchor[sh.part] = sh.anchor;
  });
  
  var lastY = -99;
  callouts.filter(function (c) { return anchor[c.part]; })
    .sort(function (a, b) { return anchor[a.part][1] - anchor[b.part][1]; })
    .forEach(function (c) {

        + '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4.5" class="cl-ring"/><circle cx="' + p[0] + '" cy="' + p[1] + '" r="1.8" class="cl-dot"/>'
        + '<text x="' + lx + '" y="' + (ly - 50) + '" class="cl-name"' + anc + '>' + c.part + '</text>'
        + '<text x="' + lx + '" y="' + (ly - 8) + '" class="cl-num"' + anc + '>' + c.num + '</text>'
        + '<text x="' + lx + '" y="' + (ly + 22) + '" class="cl-unit"' + anc + '>' + c.unit + '</text></g>';
    });
  
  s += '<g class="sidetag"><path d="M204,1016 L214,1004 L286,1004 L296,1016 L286,1028 L214,1028 Z"/><text x="250" y="1022" text-anchor="middle">' + (front ? '前面' : '背面') + '</text></g>';
  return s + '</svg>';
}

function holoSpark() {
  Array.prototype.forEach.call(document.querySelectorAll('.holofig'), function (svg) {
    var sp = svg.querySelector('.spark'); if (!sp || sp.childNodes.length || !svg.createSVGPoint) return;
    var seed = 11, rnd = function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    var pt = svg.createSVGPoint(), out = '';
    Array.prototype.forEach.call(svg.querySelectorAll('.mus:not(.lv0)'), function (m) {
      var bb = m.getBBox(), n = 0, tries = 0;
      while (n < Math.max(4, bb.width * bb.height / 260) && tries++ < 300) {
        pt.x = bb.x + rnd() * bb.width; pt.y = bb.y + rnd() * bb.height;
        if (m.isPointInFill(pt)) { n++; out += '<circle cx="' + pt.x.toFixed(1) + '" cy="' + pt.y.toFixed(1) + '" r="' + (0.5 + rnd() * 0.7).toFixed(2) + '" style="animation-delay:' + (rnd() * 4).toFixed(2) + 's"/>'; }
      }
    });
    sp.innerHTML = out;
  });
}

var LV_NAME = ['未実施', 'ウォームアップ', '普通', '追い込み'];
function partDesc(p, hm){
  return p.sets+'セット'+(hm.perWeek ? '（週平均 '+p.value+'）' : '')+'・'+LV_NAME[p.level];
}
function mapCard(d){
  var hm = d.heat, levels = {}, titles = {}, drawn = {}, sideOf = {};
  Object.keys(hm.parts).forEach(function(k){ var p = hm.parts[k]; levels[k] = p.level; titles[k] = k+'：'+partDesc(p, hm); });
  BODY.front.forEach(function(m){ if (m[0]) { drawn[m[0]] = 1; sideOf[m[0]] = sideOf[m[0]] || 'front'; } });
  BODY.back.forEach(function(m){ if (m[0]) { drawn[m[0]] = 1; sideOf[m[0]] = sideOf[m[0]] || 'back'; } });
  var extra = Object.keys(hm.parts).filter(function(k){ return !drawn[k] && hm.parts[k].sets > 0; });
  var active = Object.keys(hm.parts).filter(function(k){ return hm.parts[k].sets > 0; }).length;
  var u = hm.basis==='day' ? 'セット' : 'セット/週';
  var unitShort = hm.basis==='day' ? 'sets' : (hm.perWeek ? 'sets / wk' : 'sets');
  
  var ranked = Object.keys(hm.parts).filter(function(k){ return drawn[k] && hm.parts[k].sets > 0; })
    .sort(function(a, b){ return hm.parts[b].level - hm.parts[a].level || hm.parts[b].value - hm.parts[a].value; });
  var co = { front: [], back: [] };
  ranked.forEach(function(k){
    var side = sideOf[k], other = side === 'front' ? 'back' : 'front';
    var tgt = co[side].length < 3 ? side : (BODY[other].some(function(m){ return m[0] === k; }) && co[other].length < 3 ? other : null);
    if (tgt) co[tgt].push({ part: k, level: hm.parts[k].level, num: (hm.perWeek ? hm.parts[k].value.toFixed(1) : hm.parts[k].value), unit: unitShort });
  });
  var desc = hm.basis==='day' ? 'この日の部位ごとのセット数で色分けしています。'
    : hm.perWeek ? '期間中の1週あたり平均セット数で色分けしています（'+hm.weeks+'週分で割って算出）。'
    : 'この週の部位ごとの合計セット数で色分けしています。';
  var t = d.total.cur;
  var h = '<div class="holo">'
    + '<div class="holo-top"><div class="holo-title"><h2>部位マップ</h2><div class="holo-sub">MUSCLE MAP</div><p>'+desc+'基準は「設定」シートで変更できます</p></div>'
    + '<div class="holo-period"><i></i>'+esc(d.range.label)+'</div></div>'
    + '<div class="holo-stage"><div class="figs">'+bodySvg('front', levels, titles, co.front)+bodySvg('back', levels, titles, co.back)+'</div>'
    + '<div class="holo-side">'
    + '<div class="hud maplegend">'
    + '<div class="lg"><i class="ind lv3"></i><span>追い込み：'+hm.hard+u+'以上</span></div>'
    + '<div class="lg"><i class="ind lv2"></i><span>普通：'+hm.normal+'〜'+hm.hard+u+'未満</span></div>'
    + '<div class="lg"><i class="ind lv1"></i><span>ウォームアップ：'+hm.normal+u+'未満</span></div>'
    + '<div class="lg"><i class="ind lv0"></i><span>未実施</span></div></div>';
  if (extra.length){
    h += '<div class="hud mapextra"><div class="hud-t">図にない部位</div>' + extra.map(function(k){
      return '<span><i class="ind lv'+hm.parts[k].level+'"></i>'+esc(k)+'：'+esc(partDesc(hm.parts[k], hm))+'</span>';
    }).join('') + '</div>';
  }
  h += '<div class="hud hud-tap"><svg viewBox="0 0 40 40" class="tapico" aria-hidden="true"><circle cx="17" cy="11" r="8" class="rip"/><circle cx="17" cy="11" r="3" class="rip2"/>'
    + '<path d="M14.5,11 a2.5,2.5 0 0 1 5,0 V21 l6.5,1.4 a3,3 0 0 1 2.3,3.4 L27,34 H15.5 L10,26 a2,2 0 0 1 3,-2.4 l1.5,1.6 Z" class="finger"/></svg>'
    + '<div class="mapinfo" id="mapInfo">部位をタップすると<br>詳細を表示します</div></div>'
    + '</div></div>'
    + '<div class="holo-readout"><div><span>総負荷量</span><b>'+fmt(t.vol)+'<small>kg</small></b></div><div><span>セット</span><b>'+fmt(t.sets)+'</b></div><div><span>レップ</span><b>'+fmt(t.reps)+'</b></div><div><span>トレーニング部位</span><b>'+active+'</b></div></div>';
  return h + '</div>';
}
function bindBodyMap(){
  var hm = ST.data && ST.data.heat; if (!hm) return;
  holoSpark();
  Array.prototype.forEach.call(document.querySelectorAll('.mus'), function(el){
    el.addEventListener('click', function(){
      var part = el.getAttribute('data-part'), p = hm.parts[part];
      Array.prototype.forEach.call(document.querySelectorAll('.mus'), function(x){ x.classList.toggle('sel', x.getAttribute('data-part')===part); });
      $('mapInfo').innerHTML = '<b>'+esc(part)+'</b><br>'+esc(p ? partDesc(p, hm) : '0セット・未実施');
    });
  });
}

function metricSeg(key, list){
  return '<div class="seg" data-seg="'+key+'">'+list.map(function(m){ return '<button data-m="'+m+'" class="'+(ST[key]===m?'on':'')+'">'+METRICS[m].l+'</button>'; }).join('')+'</div>';
}
function bindMetricSegs(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-seg]'), function(seg){
    var key = seg.getAttribute('data-seg');
    Array.prototype.forEach.call(seg.querySelectorAll('button'), function(b){
      b.addEventListener('click', function(){ ST[key] = b.getAttribute('data-m'); render(); });
    });
  });
}

function niceMax(v){
  if (v<=0) return 1;
  var e = Math.pow(10, Math.floor(Math.log10(v))), f = v/e;
  var n = f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10;
  return n*e;
}

function drawTrend(){
  var d = ST.data, k = ST.trendMetric, el = $('chart');
  var W = el.clientWidth || 800, H = 260, padL = 52, padR = 8, padT = 12, padB = 30;
  var n = d.trend.length, iw = W-padL-padR, ih = H-padT-padB;
  var vmax = niceMax(Math.max.apply(null, d.trend.map(function(t){ return mval(t,k); })));
  var band = iw/n, bw = Math.min(24, band*0.7);
  var ns = 'http://www.w3.org/2000/svg';
  var s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="推移グラフ">';
  for (var i=0;i<=4;i++){
    var y = padT + ih - ih*i/4, val = vmax*i/4;
    s += '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y+'" y2="'+y+'" stroke="var(--grid)" stroke-width="1"/>';
    s += '<text x="'+(padL-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--ink-3)">'+(k==='secs'&&vmax>=120? Math.round(val/60)+'分' : fmt(val))+'</text>';
  }
  var every = Math.ceil(n / Math.max(1, Math.floor(iw/34)));
  d.trend.forEach(function(t, i){
    var v = mval(t,k), x = padL + band*i + band/2, h = vmax? ih*v/vmax : 0, y = padT+ih-h, r = Math.min(4, h);
    if (h>0) s += '<path d="M'+(x-bw/2)+','+(padT+ih)+' V'+(y+r)+' Q'+(x-bw/2)+','+y+' '+(x-bw/2+r)+','+y+' H'+(x+bw/2-r)+' Q'+(x+bw/2)+','+y+' '+(x+bw/2)+','+(y+r)+' V'+(padT+ih)+' Z" fill="var(--series)"/>';
    if (i % every === 0) s += '<text x="'+x+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" fill="var(--ink-3)">'+esc(t.label)+'</text>';
    s += '<rect class="hit" data-i="'+i+'" x="'+(padL+band*i)+'" y="'+padT+'" width="'+band+'" height="'+(ih+padB)+'" fill="transparent" style="cursor:pointer"/>';
  });
  s += '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+(padT+ih)+'" y2="'+(padT+ih)+'" stroke="var(--ink-3)" stroke-width="1"/>';
  s += '</svg><div class="tip" id="tip"></div>';
  el.innerHTML = s;
  var tip = $('tip');
  Array.prototype.forEach.call(el.querySelectorAll('.hit'), function(r){
    var i = +r.getAttribute('data-i'), t = d.trend[i];
    function show(){
      var x = padL + band*i + band/2, v = mval(t,k), y = padT + ih - (vmax? ih*v/vmax : 0);
      var sc = el.clientWidth / W;
      tip.innerHTML = '<b>'+esc(t.from===t.to? t.from : t.from+'〜'+t.to.slice(5))+'</b><br>総負荷量 '+fmt(t.vol)+'kg<br>レップ '+fmt(t.reps)+'回・セット '+t.sets+(t.secs?'<br>秒 '+fmtSecs(t.secs):'');
      tip.style.left = Math.max(70, Math.min(el.clientWidth-70, x*sc))+'px'; tip.style.top = (y*sc - 6)+'px'; tip.classList.add('show');
    }
    r.addEventListener('mouseenter', show);
    r.addEventListener('mouseleave', function(){ tip.classList.remove('show'); });
    r.addEventListener('click', function(){
      if (d.type==='year') setType('month', t.from);
      else if (d.type==='quarter') setType('week', t.from);
      else setType('day', t.from);
    });
  });
}

Array.prototype.forEach.call(document.querySelectorAll('#periodSeg button'), function(b){
  b.addEventListener('click', function(){ setType(b.getAttribute('data-p')); });
});
$('prevBtn').addEventListener('click', function(){ shift(-1); });
$('nextBtn').addEventListener('click', function(){ shift(1); });
$('todayBtn').addEventListener('click', function(){ ST.anchor = null; load(); });
var rt; window.addEventListener('resize', function(){ clearTimeout(rt); rt=setTimeout(function(){ if (ST.data && ST.data.trend.length) drawTrend(); }, 150); });
load();
