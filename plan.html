<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>減量計画</title>
<meta name="theme-color" content="#121211">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f4f2; --surface:#ffffff; --surface-2:#f0efec; --line:#e2e1dc;
  --ink:#141413; --ink-2:#55544f; --ink-3:#8a8983;
  --accent:#2a78d6; --accent-ink:#ffffff; --accent-soft:#e3eefb;
  --good:#1a7f4b; --good-soft:#dff3e8; --danger:#c73a39; --danger-soft:#fbe7e7; --warn:#b26b00; --warn-soft:#fbf0dc;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121211; --surface:#1c1c1a; --surface-2:#262624; --line:#34332f;
    --ink:#f5f4ef; --ink-2:#c3c2b7; --ink-3:#8f8e86;
    --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:#1d2d44;
    --good:#3fb57a; --good-soft:#1c3a2b; --danger:#e66767; --danger-soft:#3a1f1f; --warn:#e0a030; --warn-soft:#3a2f17;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;white-space:nowrap}
header .date{color:var(--ink-2);font-size:14px;white-space:nowrap}
header .sp{margin-left:auto}
@media (max-width:480px){ header .date{display:none} }
.navlink{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:10px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;white-space:nowrap}
.syncchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.syncchip i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.syncchip.pend i{background:var(--warn)} .syncchip.off i{background:var(--ink-3)} .syncchip.err i{background:var(--danger)}
.syncchip.err{color:var(--danger);border-color:var(--danger)}

.wrap{max-width:760px;margin:0 auto;padding:16px;padding-bottom:80px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card h3{margin:0 0 10px;font-size:13px;color:var(--ink-3);font-weight:600;letter-spacing:.04em}
.banner{border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.7;background:var(--danger-soft);color:var(--danger)}
.banner.info{background:var(--accent-soft);color:var(--ink)}
.banner.warn{background:var(--warn-soft);color:var(--ink)}
.loading,.empty{color:var(--ink-3);text-align:center;padding:18px 8px;font-size:14px}
.note{font-size:12px;color:var(--ink-3);line-height:1.7;margin-top:8px}

.btn{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;padding:0 14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:40px;font-size:14px;padding:0 12px}
.btn:disabled{opacity:.5}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.hero .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero .big{font-size:40px;font-weight:800;line-height:1.1}
.hero .big small{font-size:16px;font-weight:600;margin-left:2px}
.chip{display:inline-block;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--danger-soft);color:var(--danger)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 0}
.kv div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-size:17px}
.kv span{font-size:11px;color:var(--ink-3)}
.pos{color:var(--danger)} .neg{color:var(--good)} .mut{color:var(--ink-3)}

.target{border:2px solid var(--accent)}
.target .big{font-size:44px;font-weight:800;line-height:1.1}
.target .big small{font-size:16px;font-weight:600}
.reasons{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2);line-height:1.7}
.adv h4{margin:14px 0 4px;font-size:13px;color:var(--ink-3)}
.adv p{margin:0;font-size:14px;line-height:1.8}
.adv ul{margin:0;padding-left:18px;font-size:14px;line-height:1.8}
.adv .head{font-size:16px;font-weight:700;line-height:1.6}
.apply{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.apply input{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;width:100%}

.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:430px}
.tbl th{font-weight:600;color:var(--ink-3);font-size:11px;text-align:right;padding:4px 4px;white-space:nowrap}
.tbl td{text-align:right;padding:8px 4px;border-top:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr.today td,.tbl tr.cur td{background:var(--accent-soft)}
.tbl td small{display:block;color:var(--ink-3);font-size:10px}
.budget{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:13px;background:var(--surface-2);border-radius:10px;padding:10px 12px;line-height:1.7}
.budget b{font-size:15px}

.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{flex:1;min-width:48px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:14px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font-size:10px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .plan{fill:none;stroke:var(--good);stroke-width:2;stroke-dasharray:5 4}
.chart .ma{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--accent);opacity:.45}
.chart .now{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 3}
.legend{display:flex;gap:14px;font-size:11px;color:var(--ink-3);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:3px;margin-right:4px}

.plan-row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:5px 0;font-size:14px}
.plan-row:last-child{border-bottom:0}
.plan-row b{white-space:nowrap}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal .box{background:var(--surface);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
@media (min-width:600px){ .modal{align-items:center} .modal .box{border-radius:18px} }
.modal h2{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px}
.modal h2 .x{margin-left:auto;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2)}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.f label{font-size:12px;color:var(--ink-3);font-weight:600}
.f input{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;width:100%}
.f .hint{font-size:12px;color:var(--ink-3);line-height:1.6}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:6px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.show{opacity:1}
.toast.err{background:var(--danger);color:#fff}
.setup{max-width:560px;margin:40px auto;padding:0 16px;line-height:1.8}
</style>
</head>
<body>
<header>
  <h1>減量計画</h1>
  <span class="date" id="dateLbl"></span>
  <span class="sp"></span>
  <button class="syncchip" id="syncChip"><i></i><span>同期</span></button>
  <a class="navlink" href="body.html">体組成</a>
  <a class="navlink" href="meal.html">食事</a>
  <a class="navlink" href="index.html">← 筋トレ</a>
</header>

<div class="wrap" id="app">
  <div id="msg"></div>
  <section class="card hero" id="heroCard"><div class="loading">読み込み中…</div></section>
  <section class="card target" id="adjustCard" style="display:none"></section>
  <section class="card" id="chartCard"></section>
  <section class="card" id="dayCard"></section>
  <section class="card" id="weekCard"></section>
  <section class="card" id="monthCard"></section>
  <section class="card" id="setCard"></section>
</div>

<div class="modal" id="setModal"><div class="box">
  <h2><span>計画の設定</span><button class="x" id="sClose" aria-label="閉じる">✕</button></h2>
  <div class="fgrid">
    <div class="f"><label>目標の体脂肪率（%）</label><input type="number" id="sGoal" inputmode="decimal" step="0.5" min="5" max="40"></div>
    <div class="f"><label>開始日</label><input type="date" id="sStart"></div>
  </div>
  <div style="font-size:12px;color:var(--ink-3);line-height:1.6;margin:-4px 0 12px">基準線は、開始日からの7日間に測った日の平均（測った日だけで平均）で決まります。測る時間は生活のリズムで構いません。</div>
  <div class="fgrid">
    <div class="f"><label>1週間に減らす脂肪（kg）</label><input type="number" id="sWeekly" inputmode="decimal" step="0.05" min="0.1" max="1"><div class="hint">無理のない目安は0.4〜0.6kg（体重の1%/週以内）。</div></div>
    <div class="f"><label>期限（空欄＝ペースから逆算）</label><input type="date" id="sDeadline"><div class="hint">期限を入れると、必要なペースを逆算します。</div></div>
  </div>
  <div class="f"><label>活動係数（消費カロリー＝基礎代謝×係数）</label><input type="number" id="sAct" inputmode="decimal" step="0.05" min="1.2" max="2"><div class="hint">立ち仕事＋運動習慣で1.5〜1.6が目安。体組成が10日分たまると、実測の消費カロリーに自動で切り替わります。</div></div>
  <div class="mbtns"><button class="btn" id="sCancel">キャンセル</button><button class="btn primary" id="sSave">保存</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script src="api.js"></script>
<script src="coach.js"></script>
<script src="body-lib.js"></script>
<script src="meal-lib.js"></script>
<script src="plan-lib.js"></script>
<script src="plan-page.js"></script>
</body>
</html>
